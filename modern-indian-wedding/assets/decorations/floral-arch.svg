<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="100%" height="100%" fill="none" preserveAspectRatio="xMidYMin meet">
  <!-- Outer Indian Scalloped Arch Border -->
  <path d="M70 820 V280 C70 200, 160 110, 250 80 C300 63, 330 45, 350 30 C370 45, 400 63, 450 80 C540 110, 630 200, 630 280 V820" 
        stroke="#B89A62" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  
  <!-- Inner Arch Border -->
  <path d="M85 820 V285 C85 210, 170 125, 255 96 C302 80, 332 62, 350 48 C368 62, 398 80, 445 96 C530 125, 615 210, 615 285 V820" 
        stroke="#B89A62" stroke-width="0.8" opacity="0.4"/>

  <!-- Top Arch Apex Floral Cluster -->
  <g id="apex-florals" transform="translate(350, 42)">
    <!-- Center Blossom -->
    <circle cx="0" cy="0" r="9" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFF9F2" stroke="#B89A62" stroke-width="0.6"/>
    
    <!-- Petals -->
    <path d="M0 -9 C-4 -16, 4 -16, 0 -9 Z" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <path d="M0 9 C-4 16, 4 16, 0 9 Z" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <path d="M-9 0 C-16 -4, -16 4, -9 0 Z" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <path d="M9 0 C16 -4, 16 4, 9 0 Z" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>

    <!-- Diagonal Rosebuds -->
    <circle cx="-19" cy="-8" r="5" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <circle cx="19" cy="-8" r="5" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <circle cx="-29" cy="-2" r="3.5" fill="#FFF9F2" stroke="#B89A62" stroke-width="0.6"/>
    <circle cx="29" cy="-2" r="3.5" fill="#FFF9F2" stroke="#B89A62" stroke-width="0.6"/>

    <!-- Sage Eucalyptus Leaves -->
  </g>

  <!-- Left Arch Shoulder Florals -->
  <g transform="translate(180, 140) rotate(-35)">
    <circle cx="0" cy="0" r="7" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#FFF9F2"/>
    <circle cx="-14" cy="6" r="4.5" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.5"/>
    <circle cx="14" cy="6" r="4" fill="#FFF9F2" stroke="#B89A62" stroke-width="0.5"/>
  </g>

  <!-- Right Arch Shoulder Florals -->
  <g transform="translate(520, 140) rotate(35)">
    <circle cx="0" cy="0" r="7" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#FFF9F2"/>
    <circle cx="14" cy="6" r="4.5" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.5"/>
    <circle cx="-14" cy="6" r="4" fill="#FFF9F2" stroke="#B89A62" stroke-width="0.5"/>
  </g>

  <!-- Left Pillar Vine -->
  <g transform="translate(70, 480)">
    <path d="M0 -150 Q10 -75 0 0 Q-10 75 0 150 Q8 225 0 300" stroke="#B89A62" stroke-width="0.8" fill="none" opacity="0.4"/>
    <circle cx="-8" cy="-40" r="5" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <circle cx="8" cy="40" r="6" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <circle cx="-6" cy="180" r="4.5" fill="#FFF9F2" stroke="#B89A62" stroke-width="0.6"/>
  </g>

  <!-- Right Pillar Vine -->
  <g transform="translate(630, 480)">
    <path d="M0 -150 Q-10 -75 0 0 Q10 75 0 150 Q-8 225 0 300" stroke="#B89A62" stroke-width="0.8" fill="none" opacity="0.4"/>
    <circle cx="8" cy="-40" r="5" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <circle cx="-8" cy="40" r="6" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.6"/>
    <circle cx="6" cy="180" r="4.5" fill="#FFF9F2" stroke="#B89A62" stroke-width="0.6"/>
  </g>

  <!-- Bottom Arch Corner Accents -->
  <g transform="translate(70, 820)">
    <path d="M0 0 H50" stroke="#B89A62" stroke-width="1.5" opacity="0.6"/>
    <circle cx="25" cy="0" r="2.5" fill="#B89A62"/>
  </g>
  <g transform="translate(580, 820)">
    <path d="M0 0 H50" stroke="#B89A62" stroke-width="1.5" opacity="0.6"/>
    <circle cx="25" cy="0" r="2.5" fill="#B89A62"/>
  </g>
</svg>
