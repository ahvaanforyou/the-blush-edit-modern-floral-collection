<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" width="100%" height="40" fill="none">
  <path d="M20 20 H160" stroke="#B89A62" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M240 20 H380" stroke="#B89A62" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
