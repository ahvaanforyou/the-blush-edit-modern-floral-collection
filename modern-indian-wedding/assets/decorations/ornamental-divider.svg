    <path d="M0 4 C-12 5, -16 1, -15 -4 C-12 -1, -6 2, 0 4 Z" fill="#A8B5A0" stroke="#B89A62" stroke-width="0.8" opacity="0.8"/>
    <!-- Side right petals -->
    <path d="M0 4 C8 1, 12 -5, 9 -11 C7 -7, 4 0, 0 4 Z" fill="#E8C7C2" stroke="#B89A62" stroke-width="0.8" opacity="0.9"/>
    <path d="M0 4 C12 5, 16 1, 15 -4 C12 -1, 6 2, 0 4 Z" fill="#A8B5A0" stroke="#B89A62" stroke-width="0.8" opacity="0.8"/>
    <!-- Base scroll -->
